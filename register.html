<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <title>register</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        text-align: center;
        margin-top: 100px;
      }

      .background {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: #00ff15;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>რეგისტრაცია</h2>
    <button class="background" onclick="register()">დაწყება</button>

    <script>
      function register() {
        let firstName;
        let lastName;
        let age;
        let username;
        let password;
        firstName = prompt("შეიყვანე შენი სახელი:");
        lastName = prompt("შეიყვანე შენი გვარი:");
        age = prompt("შეიყვანე შენი ასაკი:");
        username = prompt("შეიყვანე username:");
        password = prompt("შეიყვანე პაროლი:");

        alert(
          "რეგისტრაცია წარმატებით დასრულდა!\n\n" +
            "სახელი: " +
            firstName +
            "\n" +
            "გვარი: " +
            lastName +
            "\n" +
            "ასაკი: " +
            age +
            "\n" +
            "username: " +
            username,
        );
      }
    </script>
  </body>
</html>
